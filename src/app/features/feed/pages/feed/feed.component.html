@if (loading()) {
<div class="feed-loading">
  @for (_ of [1,2,3]; track $index) {
  <div class="feed-skeleton"></div>
  }
</div>
} @else if (posts().length > 0) {
<div class="campusly-feed">
  @for (post of posts(); track post.id) {
  <div class="feed-item">
    <app-post [post]="post"></app-post>
  </div>
  }
</div>
} @else {
<div class="empty-state">
  <div class="empty-state__icon-wrap">
    <span class="material-symbols-outlined empty-state__icon">newspaper</span>
  </div>
  <p class="headline-md empty-state__title">Nessun post ancora</p>
  <p class="body-md empty-state__subtitle">Segui più utenti per vedere i loro contenuti qui.</p>
</div>
}
