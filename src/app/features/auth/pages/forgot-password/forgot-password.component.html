<main class="auth-page">
    <div class="auth-page__aurora"></div>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-5">
                <div class="auth-wrapper">

                    <header class="auth-forgot__header">
                        <a routerLink="/auth/login" class="auth-forgot__back">
                            <span class="material-symbols-outlined">arrow_back</span>
                            <span>Torna al login</span>
                        </a>
                        <h2 class="auth-forgot__heading font-headline">
                            Recupera password
                        </h2>
                        <p class="auth-forgot__desc">
                            Inserisci la tua email e ti invieremo un link per reimpostare la password.
                        </p>
                    </header>

                    <div class="auth-forgot__card card">
                        @if (!submitted) {
                            <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()" class="auth-forgot__form">
                                <div class="auth-forgot__field">
                                    <label class="auth-forgot__label">Email</label>
                                    <input type="email" formControlName="email" class="input-field input-rounded"
                                        placeholder="student&#64;polimi.it">
                                    <app-form-error [control]="forgotForm.get('email')"></app-form-error>
                                </div>
                                <button type="submit" class="btn-primary auth-forgot__submit">
                                    Invia link di recupero
                                </button>
                            </form>
                        } @else {
                            <div class="auth-forgot__success">
                                <span class="material-symbols-outlined auth-forgot__success-icon"
                                    style="font-variation-settings: 'FILL' 1;">mark_email_read</span>
                                <h3 class="auth-forgot__success-title font-headline">Email inviata!</h3>
                                <p class="auth-forgot__success-desc">
                                    Controlla la tua casella di posta e segui le istruzioni per reimpostare la password.
                                </p>
                                <button routerLink="/auth/login" class="btn-primary auth-forgot__submit">
                                    Torna al login
                                </button>
                            </div>
                        }
                    </div>

                </div>
            </div>
        </div>
    </div>
</main>
